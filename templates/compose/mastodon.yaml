# documentation: https://docs.linuxserver.io/images/docker-mastodon/#application-setup
# slogan: Mastodon is a free, open-source social network server.
# tags: mastodon,social,network
# logo: svgs/mastodon.svg
# port: 3000

services:
  mastodon:
    image: lscr.io/linuxserver/mastodon:latest
    container_name: mastodon
    environment:
      - SERVICE_FQDN_MASTODON
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - LOCAL_DOMAIN=${SERVICE_FQDN_MASTODON}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_USER=mastodon
      - DB_NAME=mastodon
      - DB_PASS=mastodon
      - DB_PORT=5432
      - ES_ENABLED=false
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OTP_SECRET=${OTP_SECRET}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - SMTP_SERVER=${SMTP_SERVER:-mail.example.com}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_LOGIN=${SMTP_LOGIN}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-notifications@example.com}
      - S3_ENABLED=false
      - WEB_DOMAIN=${SERVICE_FQDN_MASTODON}
      - ES_HOST=${ES_HOST:-es} #optional
      - ES_PORT=${ES_PORT:-9200} #optional
      - ES_USER=${ES_USER:-elastic} #optional
      - ES_PASS=${ES_PASS:-elastic} #optional
      - S3_BUCKET=${S3_BUCKET} #optional
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} #optional
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} #optional
      - S3_ALIAS_HOST=${S3_ALIAS_HOST} #optional
      - SIDEKIQ_ONLY=${SIDEKIQ_ONLY:-false} #optional
      - SIDEKIQ_QUEUE=${SIDEKIQ_QUEUE} #optional
      - SIDEKIQ_DEFAULT=${SIDEKIQ_DEFAULT:-false} #optional
      - SIDEKIQ_THREADS=${SIDEKIQ_THREADS:-5} #optional
      - DB_POOL=${DB_POOL:-5} #optional
      - NO_CHOWN=${NO_CHOWN}
    volumes:
      - /path/to/mastodon/config:/config
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
